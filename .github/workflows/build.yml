name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a public release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and verify release APK
        shell: bash
        run: |
          rm -f local.properties
          gradle --no-daemon assembleRelease --stacktrace
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/StatusStudio.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StatusStudio-apk
          path: ${{ runner.temp }}/StatusStudio.apk
          if-no-files-found: error

      # Public download link (no GitHub login needed):
      # https://github.com/<owner>/<repo>/releases/latest/download/StatusStudio.apk
      - name: Publish APK as a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          tag="v${version}-build${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP/StatusStudio.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Status Studio ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Install StatusStudio.apk on Android 10 or newer. If Android reports a conflict, uninstall the previous build first."
