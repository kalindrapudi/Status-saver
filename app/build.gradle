plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kali.statussaver'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kali.statussaver'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly on your phone.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party libraries: no ads, no analytics, no trackers.
dependencies {
}
